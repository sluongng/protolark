[package]
name = "protolark"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Protobuf-backed Starlark configuration: generate, evaluate, encode, and decode"
license = "Apache-2.0"
repository = "https://github.com/sluongng/protolark"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde", "text-format"] }
protox = "0.9.1"
serde_json = "1"
starlark = "0.14.2"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
